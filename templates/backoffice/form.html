{% extends "backoffice/base.html" %}

{% block section_title %}{{ page_title }}{% endblock %}

{% block backoffice_content %}
<section class="panel">
    <form method="post" class="admin-form">
        {% csrf_token %}
        {% for field in form %}
        <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
            <p class="field-help">{{ field.help_text }}</p>
            {% endif %}
            {{ field.errors }}
        </div>
        {% endfor %}
        <div class="form-actions">
            <button class="button-primary" type="submit">Guardar</button>
            <a class="link-button button-secondary" href="{{ cancel_url }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
